description: 'Atrium creates original characters, stories, and worlds designed to inspire lasting fandom and become defining entertainment franchises. The company focuses on building character IP, offering tools for creators, and leveraging NFTs and digital assets to monetize and expand these universes. Atrium aims to empower creators with APIs and platforms that enable seamless integration of character content across media, games, and experiences. Backed by electric-capital, Atrium is positioned at the intersection of entertainment, technology, and community-driven storytelling.'

